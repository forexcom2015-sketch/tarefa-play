name: CI

on:
  push:
    branches: ["main", "feat/phase-9-release-blocks"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Testes
        run: bun run test
      - name: Build
        run: bun run build
      - name: Lint informativo
        continue-on-error: true
        run: bun run lint

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Iniciar Supabase local
        run: supabase start
      - name: Recriar banco local e aplicar todas as migrations
        run: supabase db reset --local
      - name: Executar cenários Fase 9
        shell: bash
        run: |
          set -o pipefail
          output="$(supabase test db supabase/tests/phase9_scenarios_rollback.sql 2>&1)" || {
            echo "$output"
            exit 1
          }
          echo "$output"
          if echo "$output" | grep -E '\(FALHA\)|ERRO|SETUP:'; then
            exit 1
          fi
