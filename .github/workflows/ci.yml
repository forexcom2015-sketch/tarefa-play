name: CI

on:
  push:
    branches: ["main", "feat/phase-9-release-blocks"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Testes
        run: bun run test
      - name: Build
        run: bun run build
      - name: Lint informativo
        continue-on-error: true
        run: bun run lint
